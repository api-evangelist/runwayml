name: Runway
kind: company
description: Runway (RunwayML) is a generative AI media platform whose developer API turns text, images,
  and video into new video, images, speech, and character performances. The REST API at https://api.dev.runwayml.com/v1
  exposes Runway's Gen-4 and Gen-4 Turbo video models, Gen-4 Image text-to-image, the Aleph video-to-video
  editing model, and Act character performance, all through an asynchronous create-task-then-poll pattern
  authenticated with a Bearer API secret and a dated X-Runway-Version header. Access is API-key based
  via a developer organization; usage is billed in credits at roughly $0.01 per credit.
